career-profile:
    title: About Me
    summary: |
      I am a PhD candidate at ETH Zürich's Sensing, Interaction & Perception Lab (SIPLAB),
      working on machine learning for egocentric human motion estimation and understanding.
      My research focuses on body-worn sensing, including sparse inertial sensors, ultra-wideband
      ranging, and egocentric multi-view cameras, with the goal of capturing and interpreting
      human motion in the wild.
      Before my PhD I completed my Master's at ETH with a major in Machine Intelligence
      and my Master's Thesis at MIT CSAIL on 3D semantic segmentation from 2D supervision.
