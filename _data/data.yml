experiences:
    - role: PhD Candidate
      time: December 2023 - now
      company: SIPLAB, ETH Zürich - Zürich, CH
      details: |
        Researching machine learning for egocentric human motion estimation
        and understanding. Focus areas include body-worn sensing with sparse
        inertial sensors, ultra-wideband ranging, and egocentric multi-view
        cameras for capturing and interpreting human motion in the wild.
          - Human Motion Estimation
          - Egocentric Perception
          - Sensor Fusion
    - role: Master Thesis
      time: March 2023 - August 2023
      company: MIT (CSAIL, Medical Vision Group - Prof. Polina Golland) - Cambridge, USA
      details: |
        Worked on deep 3D semantic segmentation from 2D supervision only.
        Utilized neural radiance fields and field-to-field transformation via
        point cloud transformers, and investigated the effects of pretraining
        on fine-tuning performance for 3D semantic segmentation.
    - role: Master Studies
      time: September 2020 - November 2023
      company: ETH Zürich - Zürich, CH
      details: |
        MSc in Computer Science with a major in Machine Intelligence and a
        minor in Theoretical Computer Science.
          - Machine Intelligence
          - Theoretical Computer Science
    - role: Exchange Student
      time: August 2019 - June 2020
      company: KTH Royal Institute of Technology - Stockholm, SE
      details: |
        Completed 90 ECTS with straight A's. Wrote my Bachelor Thesis on
        <a href="https://www.researchgate.net/publication/346355217_Evaluation_of_Camera_Resolution_in_Optical_Flow_Estimation_Using_Event-Based_Cameras" target="_blank">Optical Flow Algorithms for Event-Based Cameras</a>
        (graded 1.3 German score), including a real-world optical flow dataset
        for event-based cameras to study the impact of resolution across
        different optical flow algorithms.
          - Machine Learning
          - Computer Vision
          - Robotics
    - role: Bachelor Studies
      time: September 2017 - June 2020
      company: Technical University Berlin - Berlin, GER
      details: |
        BSc in Computer Science. Graduated in the top 3% with a 1.3 German score.
projects:
    title: Internships and Projects
    intro: >
      Selected industry internships, research collaborations, and student projects.
    assignments:
      - title: Daedalean (06.2022 - 10.2022)
        link: "https://daedalean.ai/"
        tagline: "Visual traffic detection internship. Built synthetic flight scenarios from historical flight data to evaluate intruder detection accuracy, performed statistical analysis of historical flight tracks, reduced the sim-to-real gap via automatic color grading, and contributed to the data evaluation pipeline and an automated upload station for flight test data."

      - title: AMZ Driverless, ETH Formula Student (09.2020 - 09.2022)
        link: "https://driverless.amzracing.ch/en/home"
        tagline: "Developed LiDAR-based cone detection (CNN) and multi-LiDAR calibration for an autonomous racing car, built CI/CD infrastructure (Jenkins, Docker) and a custom KPI tool, and created a photorealistic Unreal Engine simulator for end-to-end autonomous driving validation. Served as Business Team Lead. 3rd place at FS Germany Driverless."

      - title: KTH Formula Student (08.2019 - 06.2020)
        link: "https://www.kthformulastudent.se/"
        tagline: "Perception team of the autonomous racing car project. Implemented fast point cloud clustering for LiDAR-based cone detection and contributed to team coordination."

      - title: AVM (06.2020 - 09.2020)
        link: "https://en.avm.de/"
        tagline: "Data analysis internship. Linked customer support data to crashes and bugs, built automated data summaries with Spark and Zeppelin, analyzed WiFi speed tests via statistical tests, and built a decision-tree-based tool for surfacing bug-causing configurations."

      - title: Selected student projects
        link: "#"
        tagline: "A handful of smaller things I've enjoyed building on the side over the years: a Wikipedia alt-text annotation tool for accessibility, weather transfer between images via GANs (Deep Learning course), drug-candidate prediction with transformers on knowledge graphs, an AR memory game for Android (Unity / Vuforia) accessible to visually impaired players, free-text semantic search in PDFs using pretrained language models, a music-reactive remote-controlled LED strip, and an automatic cat feeder."

